# ============================================================================
# University Help Desk System - Spring Boot Application Properties
# Database: MySQL (helpdesk_db)
# ============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Connection Properties
# NOTE: createDatabaseIfNotExist=true auto-creates the DB on first run.
#       Override credentials via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent Spring SQL init from conflicting with CommandLineRunner seeders
spring.sql.init.mode=never

# JWT Configuration
app.jwtSecret=${JWT_SECRET:UniversityHelpDeskSuperSecretKey2026WithSufficientLengthForHMACSHA256}
app.jwtExpirationMs=86400000
app.password-reset-token-expiration-minutes=15

# Initial administrator for a clean installation. Override these in each environment.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@localhost}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}

# Gemini AI Key Configuration
# Set via environment variable GEMINI_API_KEY, or leave empty for local KB fallback mode
gemini.api.key=${GEMINI_API_KEY:}

# Jackson JSON Settings
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload / Attachment Configuration
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ─── Email / SMTP Configuration ───────────────────────────────────────────────
# Enable email delivery by setting EMAIL_ENABLED=true. All SMTP settings must be
# provided via environment variables — no fallback credentials are hard-coded.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${SMTP_FROM:noreply@uniassist360.local}
# spring.mail.host and spring.mail.port are intentionally not set here.
# Configure via environment: SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Disable Spring Boot's mail auto-health indicator when host is not configured
management.health.mail.enabled=false

# ─── CORS Configuration ───────────────────────────────────────────────────────
# Set FRONTEND_ORIGIN in each environment. Defaults to localhost for development.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ─── SLA Threshold Configuration (in hours) ───────────────────────────────────
app.sla.threshold.low=${SLA_THRESHOLD_LOW:72}
app.sla.threshold.medium=${SLA_THRESHOLD_MEDIUM:48}
app.sla.threshold.high=${SLA_THRESHOLD_HIGH:24}
app.sla.threshold.urgent=${SLA_THRESHOLD_URGENT:8}
app.sla.threshold.critical=${SLA_THRESHOLD_CRITICAL:4}

# ─── Self-Service Password Reset & Frontend URL ───────────────────────────────
app.password-reset.self-service=${PASSWORD_RESET_SELF_SERVICE:true}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
