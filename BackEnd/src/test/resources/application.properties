# In-Memory Test Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Test JWT
app.jwtSecret=UniversityHelpDeskSuperSecretKey2026WithSufficientLengthForHMACSHA256
app.jwtExpirationMs=86400000
app.password-reset-token-expiration-minutes=15
app.bootstrap-admin.username=bootstrap_admin
app.bootstrap-admin.email=bootstrap.admin@test.invalid
app.bootstrap-admin.password=Bootstrap@123

# File Upload Test Directory
app.upload.dir=target/test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# SLA Thresholds
app.sla.threshold.low=72
app.sla.threshold.medium=48
app.sla.threshold.high=24
app.sla.threshold.urgent=8
app.sla.threshold.critical=4
